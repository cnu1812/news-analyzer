name: Morning Pulse — Daily Podcast

on:
  # Runs at 00:30 UTC = 6:00 AM IST every day
  schedule:
    - cron: "30 0 * * *"

  # Also allows manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  # Stay ahead of Node.js 20 deprecation
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Pulse pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PODCAST_BASE_URL: ${{ secrets.PODCAST_BASE_URL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          PREFER_GEMINI: true
        run: python src/main.py

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add and commit local changes first
          git add data/episodes.json index.xml podcasts/*.mp3
          git commit -m "Upload new podcast episode: ${{ steps.date.outputs.date }}" || echo "No changes to commit"
          
          # Pull latest (rebase) to resolve any remote changes
          git pull origin main --rebase
          
          # Push the final state
          git push origin main

      - name: Upload audio artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-pulse-audio
          path: output/*.mp3
          retention-days: 3
          if-no-files-found: ignore
