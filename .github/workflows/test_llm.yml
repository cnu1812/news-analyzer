name: LLM fallback tests

on:
  push:
    paths:
      - 'src/llm_utils.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test_llm.yml'
  pull_request:
    paths:
      - 'src/llm_utils.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test_llm.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.3
      - run: python -m unittest discover -s tests -v
